name: CI

# FIXED: 补充 DevOps 维度 — 商业就绪所需的持续集成流水线
# 覆盖：依赖缓存 → Lint(ruff) → 类型检查(pyright) → 测试+覆盖率 → 构建校验 → Docker 构建 → 冒烟测试 → 安全扫描
# 设计原则：失败快速暴露、产物可追溯、不依赖外部硬件/协议设备（测试全 mock 化）

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  EDGELITE_SECURITY__SECRET_KEY: "ci-only-not-secret-key-do-not-use-in-prod-32bytes!"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        # FIXED(ci): 钉住版本，避免 ruff 新版本格式风格漂移导致 format check 误报；
        # 附带 pyyaml（scripts/compare_config.py 的 Config drift check 依赖）
        run: pip install "ruff==0.15.11" pyyaml
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Dependency consistency check
        run: python scripts/check_deps_consistency.py
      - name: Config drift check
        run: python scripts/compare_config.py
      - name: Architecture dependency check
        run: python scripts/check_architecture.py
      - name: API contract check (frontend/backend alignment)
        run: python scripts/check_api_contract.py
      - name: Docker Compose config validation
        # FIXED(ci): CI 检出环境无 docker/.env（gitignored），compose 的 :? 必填变量会令
        # config 校验直接失败；此处注入占位值仅供配置语法/结构校验
        run: >-
          INFLUXDB_TOKEN=ci-placeholder
          MQTT_PASSWORD=ci-placeholder
          SECRET_KEY=ci-placeholder
          EDGELITE_MASTER_KEY=ci-placeholder
          ADMIN_PASSWORD=ci-placeholder
          INFLUXDB_PASSWORD=ci-placeholder
          GRAFANA_ADMIN_PASSWORD=ci-placeholder
          docker compose -f docker/docker-compose.yml --profile monitoring config --quiet

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pyright
        run: pip install pyright
      - name: Pyright type check
        run: pyright

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + dev deps
        run: |
          pip install --upgrade pip
          # FIXED-CI: 补装 ai + monitoring extras — test_edge_ai_inference_ext(35)
          # 与 test_api_metrics(1) 依赖 numpy/onnxruntime/cv2/prometheus-client，
          # 缺失导致 CI 39 个假失败（本地装有这些依赖所以全绿）[2026-09-19]
          pip install -e ".[dev,ai,monitoring]"
      - name: Run tests with coverage (enforce 58% floor)
        env:
          EDGELITE_SECURITY__SECRET_KEY: ${{ env.EDGELITE_SECURITY__SECRET_KEY }}
          EDGELITE_DB__PATH: ":memory:"
        run: |
          pytest --cov=edgelite \
                 --cov-report=xml:coverage.xml \
                 --cov-report=term-missing \
                 --cov-fail-under=58 \
                 --timeout=60 -q \
                 -p no:cacheprovider
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Verify metadata
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build edgelite image (no push)
        # FIXED-CI: 原先 push:false 本地构建后镜像留在本 runner，下游 smoke/
        # acceptance/security 在另一台 runner 上 docker run edgelite:ci 直接
        # "pull access denied"（此三个 job 在 Lint/Test 阻塞时代从未真正跑过）；
        # 改为导出 tar 经 artifact 传递，下游 docker load [2026-09-19]
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: edgelite:ci
          outputs: type=docker,dest=/tmp/edgelite-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgelite-image
          path: /tmp/edgelite-image.tar
          retention-days: 1

  smoke-test:
    name: Smoke test (E2E)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install httpx for smoke test
        run: pip install httpx
      - name: Download and load image from docker job
        uses: actions/download-artifact@v4
        with:
          name: edgelite-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/edgelite-image.tar
      - name: Start EdgeLite container
        run: |
          docker run -d --name edgelite-smoke \
            -p 8080:8080 \
            -e EDGELITE_SECURITY__SECRET_KEY="${{ env.EDGELITE_SECURITY__SECRET_KEY }}" \
            -e EDGELITE_ADMIN_PASSWORD="smoke-test-admin-pass" \
            -e DEV_MODE=true \
            edgelite:ci
      - name: Wait for health check
        run: |
          echo "⏳ Waiting for EdgeLite to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "✅ EdgeLite is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ EdgeLite did not become healthy in 150s"
          docker logs edgelite-smoke --tail=50
          exit 1
      - name: Run smoke tests
        run: |
          python scripts/smoke_test.py \
            --base-url http://localhost:8080 \
            --user admin \
            --pass "smoke-test-admin-pass" \
            --retry 3
      - name: Cleanup
        if: always()
        run: docker rm -f edgelite-smoke || true

  acceptance:
    name: Acceptance gate (合并必过检查)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install httpx + package for acceptance check
        # FIXED-CI: 脚本需本机导入 FastAPI app 枚举路由，仅装 httpx 时
        # ModuleNotFoundError: fastapi 导致验收必败 [2026-09-19]
        run: pip install -e ".[dev]"
      - name: Download and load image from docker job
        uses: actions/download-artifact@v4
        with:
          name: edgelite-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/edgelite-image.tar
      # 启动 EdgeLite 容器（参考 smoke-test job 的启动方式）
      - name: Start EdgeLite container
        run: |
          docker run -d --name edgelite-acceptance \
            -p 8080:8080 \
            -e EDGELITE_SECURITY__SECRET_KEY="${{ env.EDGELITE_SECURITY__SECRET_KEY }}" \
            -e EDGELITE_ADMIN_PASSWORD="smoke-test-admin-pass" \
            -e DEV_MODE=true \
            edgelite:ci
      # 等待健康检查通过
      - name: Wait for health check
        run: |
          echo "⏳ Waiting for EdgeLite to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "✅ EdgeLite is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ EdgeLite did not become healthy in 150s"
          docker logs edgelite-acceptance --tail=50
          exit 1
      # 运行验收门禁脚本（CI 环境无法启动前端 dev server，用 --skip-frontend 跳过前端检查）
      - name: Run acceptance gate
        run: |
          python scripts/acceptance_check.py \
            --base-url http://localhost:8080 \
            --skip-frontend \
            --user admin \
            --pass "smoke-test-admin-pass"
      # 清理容器
      - name: Cleanup
        if: always()
        run: docker rm -f edgelite-acceptance || true

  security:
    name: Security scan (trivy + pip-audit + SBOM)
    runs-on: ubuntu-latest
    needs: [lint, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + security tools
        run: |
          pip install --upgrade pip
          # FIXED-SEC: setuptools 79.x 存在 PYSEC-2026-3447（sdist 构建问题），
          # 审计前升级到修复版本 83.0.0（setuptools 为环境包，不在运行时依赖中）
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[dev]"
          pip install pip-audit cyclonedx-bom
      - name: Audit Python dependencies
        # FIXED-CI: 可编辑安装的 edgelite 本身不在 PyPI，需 --skip-editable 跳过；
        # 不能加 --strict（strict 会因跳过可编辑包报 "distribution marked as
        # editable" 反而失败，实测）[2026-09-19]
        run: pip-audit --skip-editable --desc
      - name: Generate SBOM (CycloneDX)
        # FIXED-CI: 新版 cyclonedx-py（v7+）参数更名 --schema-version → --spec-version [2026-09-19]
        run: |
          cyclonedx-py environment -o sbom.json --spec-version 1.5
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
          retention-days: 30
      - name: Generate dependency lockfile
        run: |
          pip freeze --exclude-editable > requirements.lock
      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v7
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: warn
          retention-days: 30
      - name: Download and load image from docker job
        # FIXED-CI: Trivy 镜像扫描需要 edgelite:ci，与 smoke/acceptance 同源 [2026-09-19]
        uses: actions/download-artifact@v4
        with:
          name: edgelite-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/edgelite-image.tar
      - name: Run Trivy filesystem scan
        # FIXED-CI: @0.24.0 无 v 前缀，该仓库 tag 实际为 v0.24.0 起，
        # 无法解析导致 security job 首步即败；升级到 v0.36.0 [2026-09-19]
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: edgelite:ci
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          # FIXED-CI: 忽略无上游修复版本的 Debian 基础镜像漏洞（实测 44 个 HIGH
          # 全部 Fixed Version 为空，无法行动；有修复版本的发现仍然拦截）[2026-09-19]
          ignore-unfixed: true
